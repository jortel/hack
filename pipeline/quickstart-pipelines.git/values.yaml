#   assetRepository:
#     kind: git
#     url: https://github.com/acme/my-service-config.git
#     branch: main
#     tag: ""
#     path: /

pipeline:
  # Build strategy: "buildah" (requires Dockerfile) or "s2i-java" (no Dockerfile needed)
  buildStrategy: buildah

  # S2I Java settings (only used when buildStrategy is s2i-java)
  s2i:
    version: openjdk-21-ubi9

  # Image registry and path for the built image
  imageRegistry: image-registry.openshift-image-registry.svc:5000
  # Image name defaults to application.name if available
  imageName: ""

  # Path to the Dockerfile in the config repository (Buildah only)
  dockerfilePath: Dockerfile

  # Source context directory within the repository
  pathContext: "."

  # Verify TLS when pushing to the image registry
  tlsVerify: "false"

  # Update the config repository with the new image tag after build
  updateConfigRepo: true
  # Path to the values file in the config repo to update
  configValuesFile: values.yaml
  # The image key to update in the values file
  configImageKey: image.tag

workspace:
  # PVC storage size for the pipeline workspace
  storageSize: 1Gi
  # Storage class (empty uses the cluster default)
  storageClass: ""
